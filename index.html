<!DOCTYPE html>
<html>

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no"/>
  <link rel="icon" type="image/png" href="./favicon.png">
  <title>Sur les traces de la Marine à Toulon - Université de Toulon</title>

  <!-- Load Leaflet CSS and JS-->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css"
    integrity="sha512-xodZBNTC5n17Xt2atTPuE1HxjVMSvLVW9ocqUKLsCC5CXdbqCmblAshOMAS6/keqq/sMZMZ19scR4PsZChSR7A=="
    crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"
    integrity="sha512-XQoYMqMTK8LvdxXYG3nZ448hOEQiglfqkJs1NOQV44cWnUrBc8PkAOcXy20w0vlaXaVUearIOBhiXZ5V3ynxwA=="
    crossorigin=""></script>

  <!-- Load Leaflet basemap providers -->
  <script src="https://unpkg.com/leaflet-providers@1.10.2/leaflet-providers.js"></script>

  <!-- Load jQuery  -->
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.min.js"></script>

  <!-- Load PapaParse -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.0/papaparse.min.js"></script>

  <!-- Load Lightbox -->
  <script src="scripts/lightbox/js/lightbox.js"></script>
  <link rel="stylesheet" href="scripts/lightbox/css/lightbox.css" />

  <!-- Load Font-Awesome -->
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.8.1/css/all.css" integrity="sha384-50oBUHEmvpQ+1lW4y57PTFmhCaXp0ML5d60M1M7uH2+nqUivzIebhndOJK28anvf" crossorigin="anonymous">
  <link rel="stylesheet" href="markers/leaflet.extra-markers.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/style-desktop.css">
  <link rel="stylesheet" href="css/loader.css">

  <style>
    /* Barre de navigation Discovery Quest sans emojis et alignée proprement */
    .quest-nav-bar {
      background: #1a252c;
      color: white;
      padding: 12px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: sans-serif;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 9999;
      box-sizing: border-box;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    .quest-nav-brand {
      font-weight: bold;
      font-size: 16px;
      letter-spacing: 0.5px;
    }
    .quest-nav-links {
      display: flex;
      gap: 20px;
    }
    .quest-nav-links a {
      color: #b0c4de;
      text-decoration: none;
      font-size: 14px;
      transition: color 0.2s;
    }
    .quest-nav-links a:hover {
      color: #ffffff;
    }
    /* Décalage de la page pour ne pas cacher le contenu sous la barre fixe */
    body {
      padding-top: 45px;
    }
    /* Style non centré pour la section À propos / Projet */
    #about-section {
      text-align: left !important;
      padding: 15px;
      font-family: sans-serif;
    }
  </style>
</head>

<body>

  <!-- Barre de navigation Discovery Quest -->
  <div class="quest-nav-bar">
    <div class="quest-nav-brand">Toulon Discovery Quest</div>
    <div class="quest-nav-links">
      <a href="#map">La Carte</a>
      <a href="#narration">Parcours</a>
      <a href="#about">Projet Univ Toulon</a>
    </div>
  </div>

  <div id="title">
    <div id="logo"></div>
    <div id="header"></div>
  </div>

  <div id="narration">
    <div id="contents">
      <div id="top"></div>
      
      <!-- Section À propos alignée à gauche -->
      <div id="about" style="margin-top: 40px; border-top: 1px solid #ddd; padding-top: 20px;">
        <div id="about-section">
          <h3>À propos du projet</h3>
          <p><strong>Projet Université de Toulon</strong></p>
          <p>Ce parcours mémoriel et interactif explore l'histoire maritime, militaire et civile de Toulon à travers un format de quête et d'exploration urbaine.</p>
        </div>
      </div>

    </div>
  </div>

  <div class="loader">Loading...</div>
  <div id="map"></div>

  <script type="text/javascript">
    // Create the Leaflet map centered on Toulon
    var map = L.map('map', {
      center: [43.1206, 5.9282],
      zoom: 13,
      scrollWheelZoom: false,
      zoomControl: false,
      tap: false
    });
  </script>

  <script type="text/javascript" src="google-doc-url.js"></script>
  <script type="text/javascript" src="markers/leaflet.extra-markers.min.js"></script>
  <script type="text/javascript" src="scripts/constants.js"></script>
  <script type="text/javascript" src="scripts/jquery.csv.js"></script>
  <script type="text/javascript" src="scripts/storymap.js"></script>

</body>
</html>
